<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="white"/>
  
  <!-- Grid background -->
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.05"/>
  
  <!-- Yellow accent block -->
  <rect x="800" y="100" width="240" height="240" fill="#FACC15" transform="rotate(12 800 100)"/>
  
  <!-- Blue accent block -->
  <rect x="300" y="100" width="400" height="80" fill="#3B82F6"/>
  
  <!-- Main title with offset shadows -->
  <g>
    <text x="602" y="250" font-family="monospace" font-size="120" font-weight="900" text-anchor="middle" fill="#000000" transform="rotate(-1 602 250)">BLOKS.DEV</text>
    <text x="598" y="246" font-family="monospace" font-size="120" font-weight="900" text-anchor="middle" fill="#EF4444" opacity="0.7" filter="blur(1px)" transform="rotate(-1 598 246)">BLOKS.DEV</text>
    <text x="606" y="254" font-family="monospace" font-size="120" font-weight="900" text-anchor="middle" fill="#3B82F6" opacity="0.7" filter="blur(1px)" transform="rotate(-1 606 254)">BLOKS.DEV</text>
  </g>
  
  <!-- Subtitle -->
  <text x="602" y="350" font-family="monospace" font-size="48" font-weight="700" text-anchor="middle" fill="#000000">BRUTALIST UI COMPONENTS</text>
  
  <!-- Black description box -->
  <rect x="300" y="400" width="600" height="100" fill="#000000" transform="rotate(1 300 400)"/>
  <text x="602" y="460" font-family="monospace" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">RAW. BOLD. UNFORGETTABLE.</text>
  
  <!-- Pattern definitions -->
  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#000000" stroke-width="0.5"/>
    </pattern>
  </defs>
</svg>
